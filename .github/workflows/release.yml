name: Release

# A cada tag v* (ex.: v0.1.0): gera o APK release assinado e publica em Releases.
# Também pode ser disparado à mão (aba Actions > Release > Run workflow) informando a
# versão: nesse caso o próprio workflow cria a tag v<versão> no commit escolhido.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      versao:
        description: "Versão sem o v (ex.: 0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Definir versão
        env:
          VERSAO_MANUAL: ${{ inputs.versao }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then v="${VERSAO_MANUAL#v}"; else v="${GITHUB_REF_NAME#v}"; fi
          if ! echo "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then echo "::error::Versão inválida: $v (use 1.2.3)"; exit 1; fi
          echo "VERSAO=$v" >> "$GITHUB_ENV"
          echo "TAG=v$v" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4

      # Só KEYSTORE_BASE64 e KEYSTORE_PASSWORD são obrigatórios.
      # KEY_ALIAS e KEY_PASSWORD são opcionais: o alias é detectado na keystore e,
      # em keystores PKCS12 (padrão do keytool), a senha da chave é a da keystore.
      - name: Conferir Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          faltando=""
          for v in KEYSTORE_BASE64 KEYSTORE_PASSWORD; do
            [ -n "${!v}" ] || faltando="$faltando $v"
          done
          if [ -n "$faltando" ]; then
            echo "::error::Secrets ausentes:$faltando. Cadastre em Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Restaurar keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_BASE64" | tr -d ' \r\n\t' | base64 --decode > "$RUNNER_TEMP/release.jks"

      # Confere a keystore e escolhe alias e senha da chave (sem mostrar nenhum valor).
      - name: Conferir keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          ks="$RUNNER_TEMP/release.jks"
          lista="$RUNNER_TEMP/lista.txt"
          echo "Arquivo restaurado: $(stat -c%s "$ks") bytes, SHA-256 $(sha256sum "$ks" | cut -d' ' -f1)"
          if [ "$KEYSTORE_PASSWORD" != "$(printf '%s' "$KEYSTORE_PASSWORD" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')" ]; then
            echo "::warning::KEYSTORE_PASSWORD começa ou termina com espaço/quebra de linha"
          fi
          if ! keytool -list -keystore "$ks" -storepass:env KEYSTORE_PASSWORD > "$lista" 2>&1; then
            echo "::error::KEYSTORE_PASSWORD não abre o arquivo de KEYSTORE_BASE64 (senha errada ou Base64 de outro arquivo)."
            grep -i -E "exception|error" "$lista" | head -3
            rm -f "$lista"; exit 1
          fi
          grep -i "keystore type" "$lista"
          aliases=$(grep -E "PrivateKeyEntry" "$lista" | cut -d, -f1)
          if [ -n "$KEY_ALIAS" ] && printf '%s\n' "$aliases" | grep -qxF "$KEY_ALIAS"; then
            alias="$KEY_ALIAS"
          elif [ "$(printf '%s\n' "$aliases" | grep -c .)" = "1" ]; then
            alias="$aliases"
            [ -n "$KEY_ALIAS" ] && echo "::warning::KEY_ALIAS não existe na keystore; usando a única chave encontrada ($alias)."
          else
            echo "::error::Não consegui escolher a chave. Aliases na keystore:"; printf '%s\n' "$aliases"
            rm -f "$lista"; exit 1
          fi
          if grep -qi "keystore type: PKCS12" "$lista"; then usar_key_password=0; else usar_key_password=1; fi
          rm -f "$lista"
          echo "ALIAS_ASSINATURA=$alias" >> "$GITHUB_ENV"
          echo "USAR_KEY_PASSWORD=$usar_key_password" >> "$GITHUB_ENV"
          echo "Keystore confere. Chave: $alias"

      - name: Testes e APK release assinado
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ env.ALIAS_ASSINATURA }}
          KEY_PASSWORD: ${{ (env.USAR_KEY_PASSWORD == '1' && secrets.KEY_PASSWORD != '') && secrets.KEY_PASSWORD || secrets.KEYSTORE_PASSWORD }}
        run: ./gradlew --no-daemon -PappVersion="$VERSAO" testReleaseUnitTest assembleRelease

      - name: Verificar assinatura e renomear
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          test -f "$apk" || { echo "::error::APK assinado não foi gerado"; exit 1; }
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          "$apksigner" verify --print-certs "$apk"
          cp "$apk" "cube-baby-presets-${TAG}.apk"

      - name: Apagar keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: Cube Baby Presets ${{ env.TAG }}
          files: cube-baby-presets-${{ env.TAG }}.apk
          generate_release_notes: true
