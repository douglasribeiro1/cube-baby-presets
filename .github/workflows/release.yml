name: Release

# A cada tag v* (ex.: v0.1.0): gera o APK release assinado e publica em Releases.
# Também pode ser disparado à mão (aba Actions > Release > Run workflow) informando a
# versão: nesse caso o próprio workflow cria a tag v<versão> no commit escolhido.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      versao:
        description: "Versão sem o v (ex.: 0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Definir versão
        env:
          VERSAO_MANUAL: ${{ inputs.versao }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then v="${VERSAO_MANUAL#v}"; else v="${GITHUB_REF_NAME#v}"; fi
          if ! echo "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then echo "::error::Versão inválida: $v (use 1.2.3)"; exit 1; fi
          echo "VERSAO=$v" >> "$GITHUB_ENV"
          echo "TAG=v$v" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4

      - name: Conferir Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          faltando=""
          for v in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [ -n "${!v}" ] || faltando="$faltando $v"
          done
          if [ -n "$faltando" ]; then
            echo "::error::Secrets ausentes:$faltando. Cadastre em Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Restaurar keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_BASE64" | tr -d ' \r\n\t' | base64 --decode > "$RUNNER_TEMP/release.jks"

      # Diz exatamente qual Secret não bate (sem mostrar nenhum valor).
      - name: Diagnosticar keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ks="$RUNNER_TEMP/release.jks"
          echo "Arquivo restaurado: $(stat -c%s "$ks") bytes, SHA-256 $(sha256sum "$ks" | cut -d' ' -f1)"
          for v in KEYSTORE_PASSWORD KEY_PASSWORD KEY_ALIAS; do
            val="${!v}"
            if [ "$val" != "$(printf '%s' "$val" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')" ]; then
              echo "::warning::$v começa ou termina com espaço/quebra de linha"
            fi
          done
          if ! keytool -list -keystore "$ks" -storepass:env KEYSTORE_PASSWORD > "$RUNNER_TEMP/lista.txt" 2>&1; then
            echo "::error::KEYSTORE_PASSWORD não abre o arquivo de KEYSTORE_BASE64 (senha errada ou Base64 de outro arquivo)."
            grep -i -E "exception|error" "$RUNNER_TEMP/lista.txt" | head -3
            exit 1
          fi
          grep -i "keystore type" "$RUNNER_TEMP/lista.txt"
          echo "Entradas na keystore: $(grep -ciE 'PrivateKeyEntry' "$RUNNER_TEMP/lista.txt")"
          if ! keytool -list -keystore "$ks" -storepass:env KEYSTORE_PASSWORD -alias "$KEY_ALIAS" > /dev/null 2>&1; then
            echo "::error::KEY_ALIAS não existe nessa keystore. Aliases encontrados:"
            grep -E "PrivateKeyEntry" "$RUNNER_TEMP/lista.txt" | cut -d, -f1
            exit 1
          fi
          if grep -qi "keystore type: PKCS12" "$RUNNER_TEMP/lista.txt" && [ "$KEY_PASSWORD" != "$KEYSTORE_PASSWORD" ]; then
            echo "::error::A keystore é PKCS12: KEY_PASSWORD precisa ser igual a KEYSTORE_PASSWORD."
            exit 1
          fi
          rm -f "$RUNNER_TEMP/lista.txt"
          echo "Keystore, alias e senhas conferem."

      - name: Testes e APK release assinado
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon -PappVersion="$VERSAO" testReleaseUnitTest assembleRelease

      - name: Verificar assinatura e renomear
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          test -f "$apk" || { echo "::error::APK assinado não foi gerado"; exit 1; }
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          "$apksigner" verify --print-certs "$apk"
          cp "$apk" "cube-baby-presets-${TAG}.apk"

      - name: Apagar keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: Cube Baby Presets ${{ env.TAG }}
          files: cube-baby-presets-${{ env.TAG }}.apk
          generate_release_notes: true
